# ============================================
# Caddy Request Limit Filter
# Detects request flooding (DoS/DDoS)
# ============================================

[Definition]

failregex = ^.*"remote_ip":"<HOST>".*$

ignoreregex = ^.*"uri":".*\/status\.php.*".*$
              ^.*"uri":".*\/heartbeat.*".*$

[Init]
maxlines = 1
journalmatch =

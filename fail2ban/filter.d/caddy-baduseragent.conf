# ============================================
# Caddy Bad User Agent Filter
# Detects known malicious bots/scanners
# ============================================

[Definition]

failregex = ^.*"remote_ip":"<HOST>".*"user_agent":".*sqlmap.*".*$
            ^.*"remote_ip":"<HOST>".*"user_agent":".*nikto.*".*$
            ^.*"remote_ip":"<HOST>".*"user_agent":".*masscan.*".*$
            ^.*"remote_ip":"<HOST>".*"user_agent":".*nmap.*".*$
            ^.*"remote_ip":"<HOST>".*"user_agent":".*acunetix.*".*$
            ^.*"remote_ip":"<HOST>".*"user_agent":".*ZmEu.*".*$
            ^.*"remote_ip":"<HOST>".*"user_agent":".*DirBuster.*".*$
            ^.*"remote_ip":"<HOST>".*"user_agent":".*Havij.*".*$
            ^.*"remote_ip":"<HOST>".*"user_agent":".*w3af.*".*$
            ^.*"remote_ip":"<HOST>".*"user_agent":".*Metis.*".*$
            ^.*"remote_ip":"<HOST>".*"user_agent":".*WPScan.*".*$
            ^.*"remote_ip":"<HOST>".*"user_agent":".*Burp.*".*$
            ^.*"remote_ip":"<HOST>".*"user_agent":".*Grabber.*".*$
            ^.*"remote_ip":"<HOST>".*"user_agent":".*HTTrack.*".*$

ignoreregex =

[Init]
maxlines = 1
journalmatch =

# ============================================
# Caddy 404 Error Filter
# Detects excessive 404 errors
# ============================================

[Definition]

failregex = ^.*"remote_ip":"<HOST>".*"status":404.*$

ignoreregex = ^.*"uri":".*favicon\.ico.*".*$
              ^.*"uri":".*robots\.txt.*".*$
              ^.*"uri":".*apple-touch-icon.*".*$
              ^.*"uri":".*browserconfig\.xml.*".*$
              ^.*"uri":".*site\.webmanifest.*".*$
              ^.*"uri":".*manifest\.json.*".*$
              ^.*"uri":"/\.well-known/(acme-challenge|security\.txt|host-meta|caldav|carddav|webfinger|nodeinfo)(/.*)?".*$
              ^.*"uri":".*\.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf)(\?|$).*".*$

[Init]
maxlines = 1
journalmatch =
